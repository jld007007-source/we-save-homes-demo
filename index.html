<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#3a0b0b"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>We Save Homes | Las Vegas Foreclosure Prevention Education</title>
<meta name="description" content="Jesse Keenan — Las Vegas Realtor since 2000. Education and guidance for homeowners facing foreclosure. Call (702) 400-9266."/>
<style>
:root{
  --navy:#3a0b0b; --navy2:#561212; --navy3:#7d1a1a;
  --gold:#e63946; --gold2:#ff6b6b; --gold3:#ffb3b3;
  --white:#ffffff; --off:#fbf0f0; --muted:#7c5b5b;
  --glass:rgba(255,255,255,.12); --glass-border:rgba(255,107,107,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--off);color:var(--navy);line-height:1.5;
  background-image:
    radial-gradient(ellipse 80% 50% at 10% -10%, rgba(230,57,70,.08), transparent),
    radial-gradient(ellipse 60% 40% at 100% 20%, rgba(125,26,26,.06), transparent);
}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* Topbar glass */
.topbar{
  background:rgba(58,11,11,.88);color:#fff;padding:12px 0;
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid rgba(255,107,107,.25);
  box-shadow:0 8px 32px rgba(58,11,11,.35);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;letter-spacing:.02em;font-size:1.05rem;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.brand span{color:var(--gold2);text-shadow:0 0 18px rgba(255,107,107,.45)}

/* CTA glow */
.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,var(--gold3) 0%,var(--gold2) 40%,var(--gold) 100%);
  color:var(--navy);font-weight:800;text-decoration:none;border-radius:999px;
  padding:12px 18px;min-height:48px;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:
    0 4px 16px rgba(230,57,70,.45),
    0 0 24px rgba(255,107,107,.35),
    inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  animation:ctaPulse 2.8s ease-in-out infinite;
}
.cta:hover{transform:scale(1.04);filter:brightness(1.06);box-shadow:0 8px 28px rgba(230,57,70,.55),0 0 36px rgba(255,107,107,.5),inset 0 1px 0 rgba(255,255,255,.55)}
.cta:active{transform:scale(.97)}
.cta.block{width:100%;font-size:1.15rem;padding:16px 20px}
@keyframes ctaPulse{
  0%,100%{box-shadow:0 4px 16px rgba(230,57,70,.45),0 0 20px rgba(255,107,107,.3),inset 0 1px 0 rgba(255,255,255,.5)}
  50%{box-shadow:0 6px 22px rgba(230,57,70,.6),0 0 36px rgba(255,107,107,.55),inset 0 1px 0 rgba(255,255,255,.55)}
}

/* Hero with tilt + animated gradient */
.hero{
  position:relative;overflow:hidden;color:#fff;padding:40px 0 48px;
  background:linear-gradient(155deg,var(--navy) 0%,var(--navy2) 45%,var(--navy3) 100%);
}
.hero::before{
  content:"";position:absolute;inset:-40% -20%;
  background:conic-gradient(from 180deg at 50% 50%,
    transparent 0deg, rgba(230,57,70,.18) 60deg, transparent 120deg,
    rgba(125,26,26,.4) 200deg, transparent 280deg);
  animation:heroSweep 12s linear infinite;
  pointer-events:none;
}
.hero::after{
  content:"";position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,107,107,.28),transparent 70%);
  top:-60px;right:-40px;filter:blur(8px);pointer-events:none;
}
@keyframes heroSweep{to{transform:rotate(360deg)}}
.hero .wrap{position:relative;z-index:1;transform:perspective(900px) rotateX(1.5deg);transform-origin:center top}
.hero h1{
  font-size:clamp(1.85rem,6.2vw,2.55rem);line-height:1.12;margin:12px 0 14px;
  text-shadow:0 4px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.08);
  letter-spacing:-.02em;
}
.hero p{color:#ecd7d7;font-size:1.05rem;margin-bottom:18px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.badge{
  display:inline-block;
  background:linear-gradient(135deg,rgba(230,57,70,.22),rgba(230,57,70,.08));
  border:1px solid rgba(230,57,70,.5);color:var(--gold2);
  font-size:.78rem;font-weight:700;padding:6px 12px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.05em;
  box-shadow:0 4px 16px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.15);
}

.partner-badge{
  display:flex;flex-direction:column;gap:6px;margin-top:16px;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid var(--glass-border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#ffd6d6;padding:14px 16px;border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.2);
}
.partner-badge .line1{font-size:.88rem;font-weight:800;letter-spacing:.01em;color:#fff}
.partner-badge .line1 span{color:var(--gold2)}
.partner-badge .line2{font-size:.78rem;font-weight:600;color:#ecd7d7;opacity:.95}

.section{padding:40px 0}
.section h2{font-size:1.5rem;margin-bottom:8px;letter-spacing:-.01em}
.section .lead{color:var(--muted);margin-bottom:18px}

/* Layered glass cards */
.card{
  background:linear-gradient(165deg,#ffffff 0%,#f9f7f7 100%);
  border-radius:18px;padding:20px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 10px 28px rgba(58,11,11,.1),
    0 2px 6px rgba(58,11,11,.06);
  margin-bottom:14px;
  border:1px solid rgba(232,237,245,.95);
  transition:transform .22s ease, box-shadow .22s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 16px 36px rgba(58,11,11,.14),0 4px 10px rgba(58,11,11,.08)}

.ways{display:grid;gap:12px}
.way{display:flex;gap:12px;align-items:flex-start}
.num{
  flex:0 0 34px;height:34px;border-radius:50%;
  background:linear-gradient(145deg,var(--navy3),var(--navy));
  color:var(--gold2);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.9rem;
  box-shadow:0 4px 12px rgba(58,11,11,.3), inset 0 1px 0 rgba(255,255,255,.15);
}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.stat{
  background:linear-gradient(160deg,var(--navy2),var(--navy));
  color:#fff;border-radius:16px;padding:16px 10px;text-align:center;
  border:1px solid rgba(230,57,70,.25);
  box-shadow:0 10px 24px rgba(58,11,11,.25), inset 0 1px 0 rgba(255,255,255,.1);
  transition:transform .2s ease;
}
.stat:hover{transform:translateY(-2px) scale(1.02)}
.stat strong{display:block;font-size:1.4rem;color:var(--gold2);text-shadow:0 0 16px rgba(255,107,107,.35)}
.stat span{font-size:.75rem;color:#e3c9c9}

.story{border-left:4px solid var(--gold);padding-left:16px;position:relative}
.story::before{
  content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--gold3),var(--gold),transparent);
  border-radius:2px;
}

.video-wrap{
  position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;
  border-radius:16px;background:#000;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.video-note{font-size:.8rem;color:var(--muted);margin-top:10px}

.disclaimer{
  font-size:.78rem;color:var(--muted);
  background:linear-gradient(135deg,#fff0f0,#ffe6e6);
  border:1px solid #dfb0b0;border-radius:14px;padding:14px;margin-top:16px;
  box-shadow:0 4px 16px rgba(230,57,70,.08);
}

.footer{
  background:linear-gradient(180deg,var(--navy2),var(--navy));
  color:#e3c9c9;padding:32px 0 100px;font-size:.9rem;
  border-top:1px solid rgba(255,107,107,.2);
}
.footer a{color:var(--gold2);text-decoration:none}
.powered{margin-top:18px;font-size:.85rem;font-weight:700;color:var(--gold2);line-height:1.45}

.sticky-call{
  position:fixed;left:0;right:0;bottom:0;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:rgba(58,11,11,.92);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-top:1px solid rgba(255,107,107,.3);
  z-index:30;box-shadow:0 -8px 32px rgba(0,0,0,.35);
}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease, transform .55s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media (min-width:720px){.ways{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){
  .cta{animation:none}
  .hero::before{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
}

/* Meet Jesse */
.meet{padding:36px 0;background:linear-gradient(180deg,#fff 0%,#f7f3f3 100%)}
.meet-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0 18px}
.meet-photo{
  position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;
  box-shadow:0 12px 28px rgba(58,11,11,.18),0 0 0 1px rgba(230,57,70,.25);
  transform:translateZ(0);transition:transform .22s ease, box-shadow .22s ease;
}
.meet-photo:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 36px rgba(58,11,11,.22),0 0 0 1px rgba(230,57,70,.4)}
.meet-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05)}
.meet-photo figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:10px 10px 8px;
  background:linear-gradient(transparent,rgba(58,11,11,.85));
  color:#ffd6d6;font-size:.72rem;font-weight:700;text-align:center;
}
.meet-clip{margin-top:8px}
.meet-clip .video-wrap{padding-bottom:56.25%;border-radius:16px}
@media (max-width:560px){.meet-grid{grid-template-columns:1fr 1fr}.meet-grid .meet-photo:last-child{grid-column:1 / -1;max-width:70%;justify-self:center}}

/* Pricing */
.pricing{padding:40px 0 20px;background:linear-gradient(165deg,var(--navy) 0%,var(--navy2) 55%,#7d1a1a 100%);color:#fff;position:relative;overflow:hidden}
.pricing::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 0%,rgba(255,107,107,.18),transparent 50%);pointer-events:none}
.pricing .wrap{position:relative;z-index:1}
.pricing h2{color:#fff;font-size:1.55rem}
.pricing .lead{color:#e3c9c9}
.price-grid{display:grid;gap:14px;margin-top:18px}
@media (min-width:640px){.price-grid{grid-template-columns:1fr 1fr}}
.price-card{
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid rgba(255,107,107,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;padding:20px 18px;
  box-shadow:0 12px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .2s ease, box-shadow .2s ease;
}
.price-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.25)}
.price-card.featured{
  border-color:rgba(255,107,107,.75);
  background:linear-gradient(160deg,rgba(255,107,107,.22),rgba(255,255,255,.08));
  box-shadow:0 14px 40px rgba(230,57,70,.25), inset 0 1px 0 rgba(255,255,255,.25);
}
.price-card .tier{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2)}
.price-card h3{font-size:1.2rem;margin:6px 0 4px;color:#fff}
.price-card .price{font-size:1.85rem;font-weight:800;color:var(--gold3);margin:8px 0;text-shadow:0 0 20px rgba(255,107,107,.35)}
.price-card .price small{font-size:.85rem;font-weight:600;color:#ecd7d7}
.price-card ul{list-style:none;margin:10px 0 16px;padding:0}
.price-card li{font-size:.9rem;color:#ecd7d7;padding:5px 0 5px 22px;position:relative}
.price-card li::before{content:"✓";position:absolute;left:0;color:var(--gold2);font-weight:800}
.price-note{margin-top:18px;font-size:.85rem;color:#e3c9c9;text-align:center}
.speed-pill{
  display:inline-block;margin-bottom:10px;
  background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.45);
  color:var(--gold2);font-size:.78rem;font-weight:800;padding:6px 12px;border-radius:999px;
  letter-spacing:.04em;text-transform:uppercase;
}

/* Alert strip */
.alert-strip{
  background:linear-gradient(90deg,#7d1a1a,#3a0b0b);
  color:#ffd6d6;text-align:center;font-size:.82rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;padding:8px 12px;
  border-bottom:1px solid rgba(255,107,107,.4);
}
.alert-strip strong{color:#ffb3b3}
</style>
</head>
<body>
<div class="alert-strip"><strong>Act now</strong> — foreclosure auctions move fast. Call before the date is set.</div>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">We Save <span>Homes</span></div>
    <a class="cta" href="tel:+17024009266">Call Now</a>
  </div>
</header>

</body>
</html>
